# Configuration for ESP32 builds
# This file is used when building for ESP32 targets in WSL

[build]
target = "xtensa-esp32-espidf"

[target.xtensa-esp32-espidf]
linker = "ldproxy"

# use [espflash](https://github.com/esp-rs/espflash) to flash and monitor
runner = "espflash flash --monitor"

# alternatively, you can flash with your browser
# via [web-flash](https://github.com/esp-rs/esp-web-flash-server)
# runner = "web-flash --chip=esp32 "

rustflags = [ "--cfg",  "espidf_time64"]

[unstable]
build-std = ["std", "panic_abort"]

[env]
MCU="esp32"
# Note: this variable is not used by the pio builder (`cargo build --features pio`)
ESP_IDF_VERSION = "v5.2.3"

# For Windows preview builds (when building with --target x86_64-pc-windows-msvc)
[target.x86_64-pc-windows-msvc]
rustflags = [
  "-L", "native=C:\\vcpkg\\installed\\x64-windows\\lib",
  "-L", "native=C:\\vcpkg\\installed\\x64-windows\\bin",
]
